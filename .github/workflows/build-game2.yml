name: Build Game 2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KidsPuzzleWorld/**"
      - ".github/workflows/build-game2.yml"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Check project
        run: |
          echo "Checking project..."
          ls -la
          ls -la KidsPuzzleWorld
          test -f KidsPuzzleWorld/settings.gradle.kts
          test -f KidsPuzzleWorld/app/build.gradle.kts

      - name: Build Debug APK
        working-directory: KidsPuzzleWorld
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find KidsPuzzleWorld/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-2-APK
          path: KidsPuzzleWorld/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
